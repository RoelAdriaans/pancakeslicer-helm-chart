{{- if and .Values.bearerToken (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pancakeslicer.fullname" . }}
  labels:
    {{- include "pancakeslicer.labels" . | nindent 4 }}
type: Opaque
stringData:
  ORCA_WEB_BEARER_TOKEN: {{ .Values.bearerToken | quote }}
{{- end }}
