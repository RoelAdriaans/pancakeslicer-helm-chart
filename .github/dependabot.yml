version: 2
updates:
  # Tracks the zimengxiong/pancakeslicer image tag in values.yaml
  - package-ecosystem: "helm"
    directory: "/charts/pancakeslicer"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
