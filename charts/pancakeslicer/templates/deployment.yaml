apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pancakeslicer.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "pancakeslicer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pancakeslicer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pancakeslicer.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pancakeslicer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 6868
          env:
            - name: ORCA_WEB_MAX_JOBS
              value: {{ .Values.config.maxJobs | quote }}
            - name: ORCA_WEB_PRINTER_NETWORK
              value: {{ .Values.config.printerNetwork | quote }}
            - name: PANCAKE_STAGE_CACHE_MAX_MB
              value: {{ .Values.config.stageCacheMaxMb | quote }}
            {{- if or .Values.existingSecret .Values.bearerToken }}
            - name: ORCA_WEB_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "pancakeslicer.fullname" .) .Values.existingSecret }}
                  key: ORCA_WEB_BEARER_TOKEN
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: pancakeslicer-data
              mountPath: /data
      volumes:
        - name: pancakeslicer-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default .Values.persistence.name .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
