image:
  repository: zimengxiong/pancakeslicer
  tag: "0.5.6"
  pullPolicy: IfNotPresent

# Namespace the chart creates and installs into.
namespace: pancakeslicer

replicaCount: 1

config:
  maxJobs: "2"              # slices running at once; more queue
  printerNetwork: lan       # lan | off | comma-separated CIDRs/host names
  stageCacheMaxMb: "1024"   # engine stage cache cap (disposable)

# Require a token for changes (recommended if exposed).
# Set either bearerToken or existingSecret (secret key: ORCA_WEB_BEARER_TOKEN).
bearerToken: ""
existingSecret: ""

service:
  type: ClusterIP
  port: 6868

ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: 512m
  hosts:
    - host: pancakeslicer.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: pancakeslicer-tls
  #    hosts:
  #      - pancakeslicer.example.com

persistence:
  enabled: true
  name: pancakeslicer-data
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

resources:
  limits:
    memory: 8Gi

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Extra Kubernetes objects to deploy with the chart (maps or strings; templated with tpl).
extraObjects: []
